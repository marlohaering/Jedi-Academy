// Jedi Academy browser server: Free For All on mp/ffa3 for everyone
seta sv_hostname "Jedi Academy Web FFA"
seta sv_maxclients 16
seta sv_pure 0              // browser clients load a repacked asset set
seta sv_allowDownload 0
seta sv_master1 ""          // private server: don't announce to master servers
seta sv_master2 ""
seta sv_master3 ""
seta sv_fps 40               // 40 snapshots/s: up to ~25 ms less input lag than the default 20
seta g_gametype 0           // FFA
seta fraglimit 30
seta timelimit 15
seta g_inactivity 0
// every player reaches the server through the web gateway (127.0.0.1), so the per-IP
// connection limit would block everyone after the third player
seta g_antiFakePlayer 0
seta sv_timeout 30          // free the slot quickly when a browser tab is closed
seta bot_enable 0
// JA++ (FS_GAME=japlus, see server/README.md); unknown cvars are harmless on the base game
seta japp_maxConnPerIP 32   // same reason as g_antiFakePlayer: the JA++ default of 3 would block the fourth player
seta japp_passRankConflicts 1
// shown on the loading screen (stock client) ...
seta g_motd "Lightsabers ready - type /ammotd in the console for the server info"
// ... and after joining, and on /ammotd (lua/sv/welcome); \n = new line, ^1-^7 = colours
seta welcome_motd "^3Welcome to the ^5Jedi Academy ^3Web Arena^7!\n\n^7Free For All on ^2Tatooine City^7 - first to ^330^7 kills wins\n\n^7Emotes: ^5/amhug /amkneel /ambreakdance /amvictory ^7...\n^7Admins: ^5/amlogin <user> <password>^7\n\n^7May the Force be with you."
// rconpassword: secrets.cfg on the data volume (/data/base), not in the repo;
// JA++ admin accounts: admins.json in fs_homepath (/data/home/japlus on the volume)
exec secrets.cfg
map mp/ffa3
