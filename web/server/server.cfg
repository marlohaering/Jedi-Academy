// Jedi Academy browser server: Free For All on mp/duel1 (Bespin Courtyard) for everyone
seta sv_hostname "Jedi Academy Web FFA"
seta sv_maxclients 32
seta sv_pure 0              // browser clients load a repacked asset set
seta sv_allowDownload 0
seta sv_master1 ""          // private server: don't announce to master servers
seta sv_master2 ""
seta sv_master3 ""
seta sv_fps 40               // 40 snapshots/s: up to ~25 ms less input lag than the default 20
seta g_gametype 0           // FFA
seta fraglimit 30
seta timelimit 15
seta g_inactivity 0
// every player reaches the server through the web gateway (127.0.0.1), so the per-IP
// connection limit would block everyone after the third player
seta g_antiFakePlayer 0
seta sv_timeout 30          // free the slot quickly when a browser tab is closed
seta bot_enable 1           // companion bot "BOT" while humans are on (lua/sv/companion)
seta bot_minplayers 0       // no random fill-up bots
seta dmflags 8              // no falling damage (pairs with the hook and the jetpack)
seta g_spawnInvulnerability 1500
seta g_maxForceRank 7       // Jedi Master, every force power allowed
seta g_forcePowerDisable 0
seta g_forceRegenTime 80    // 80 ms between Force regeneration ticks
seta g_weaponDisable 0      // every gun pickup on the map stays (spawn weapons: japp_spawnWeaps, JA++ default)
seta g_dismember 0
seta g_allowVote 0          // no player votes: admins decide (map, kick, gametype)
// private duels: 1 allow + 2 several at once + 4 refill health/shield + 8 no dismemberment + 64 full force
seta g_privateDuel 79
seta g_privateDuelHealth 100
seta g_privateDuelShield 100
// JA++ (FS_GAME=japlus, see server/README.md); unknown cvars are harmless on the base game
seta japp_maxConnPerIP 32   // same reason as g_antiFakePlayer: the JA++ default of 3 would block the fourth player
seta japp_passRankConflicts 1
// gametype bitmasks (1<<g_gametype): 1 = FFA only
seta japp_allowHook 1       // grappling hook on +button12 (shell binds F, phone "Hook"); stock cgame: no rope drawn
seta japp_hookDebouncer 0   // no cooldown between hook shots
seta japp_allowJetpack 1    // /jetpack toggles the jetpack holdable (shell binds J, phone "Jet"); fly with +use in the air
seta japp_spawnItems 0      // nothing handed out at spawn
seta japp_duelStats 7       // end-of-duel message: health, time, hits
seta japp_saberTweaks 0     // stock MP saber
seta japp_flipKick 1        // JA++ defaults: 20 damage, knockdown, none in duels
seta japp_unlagged 1        // lag compensation for hitscan weapons (phone networks)
seta japp_allowSaberSwitch 1
seta japp_allowWeaponDrop 1
seta japp_allowDropSaber 1
seta japp_allowEmotes 1
// shown on the loading screen (stock client) ...
seta g_motd "Lightsabers ready - type /ammotd in the console for the server info"
// ... and after joining, and on /ammotd (lua/sv/welcome); \n = new line, ^1-^7 = colours
seta welcome_motd "^3Welcome to the ^5Jedi Academy ^3Web Arena^7!\n\n^7Free For All - first to ^330^7 kills wins\n\n^7Grappling hook: hold ^5F^7 (phone: ^5Hook^7)\n^7Jetpack: ^5J^7 or ^5/jetpack^7 to get it, then jump and ^5R^7 / use to fly (phone: ^5Jet^7)\n^7No fall damage. Change saber: ^5/saber^7, drop weapon: ^5/drop^7\n^7Emotes: ^5/amhug /amkneel /ambreakdance /amvictory ^7...\n^7Admins: ^5/amlogin <user> <password>^7\n\n^7May the Force be with you."
// rconpassword: secrets.cfg on the data volume (/data/base), not in the repo;
// JA++ admin accounts: admins.json in fs_homepath (/data/home/japlus on the volume)
exec secrets.cfg
map mp/duel1
