// Run on the server: exec fill-bots.cfg (client console: rcon exec fill-bots.cfg)
// Reset bots, then try each stock bot once, skill 5, FFA. Humans keep their slots.
// Once sv_maxclients is reached, remaining addbot commands report no free slots.
// No map change, slot-limit change or automatic refill. Safe to execute again.
// companion_paused is read by the Companion Lua plugin shipped with this config.
set companion_paused 1
set bot_minplayers 0
kick allbots
addbot "Alora" 5 free 0
