<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jedi Academy FFA</title>
<style>
  :root { --bg:#05070c; --fg:#d8e2f0; --muted:#7d8aa0; --accent:#4aa3ff; --panel:#0c1220; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  /* fixed + 100% follows the visible viewport (100vh would reach under Android's address bar);
     object-fit keeps the aspect ratio when the viewport changes (bars, fullscreen) */
  #canvas { position:fixed; inset:0; width:100%; height:100%; display:block; background:#000; outline:none;
    object-fit:contain; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #0d1a33 0%, var(--bg) 70%); z-index:2; padding:0 16px; }
  #overlay.hidden { display:none; }
  .card { width:100%; max-width:520px; text-align:center; }
  h1 { margin:0 0 6px; font-size:28px; letter-spacing:.06em; color:#ffe81f; text-transform:uppercase; }
  p { color:var(--muted); margin:8px 0; }
  #status { color:var(--fg); min-height:1.4em; }
  progress { width:100%; height:6px; accent-color:var(--accent); }
  input { width:100%; max-width:280px; box-sizing:border-box; margin-top:14px; padding:10px 12px; font-size:15px;
    border-radius:6px; background:var(--panel); color:var(--fg); border:1px solid #23324d; text-align:center; }
  button { margin-top:12px; padding:10px 22px; font-size:15px; border-radius:6px; border:1px solid var(--accent);
    background:transparent; color:var(--fg); cursor:pointer; }
  button:hover { background:var(--accent); color:#000; }
  button:disabled { opacity:.4; cursor:default; }
  kbd { background:var(--panel); border:1px solid #233; border-radius:3px; padding:0 5px; font-size:12px; }
  #log { position:fixed; left:0; right:0; bottom:0; max-height:35vh; overflow:auto; margin:0; padding:6px 10px;
    font:11px/1.35 ui-monospace, monospace; background:rgba(0,0,0,.8); color:#9fb; z-index:3; display:none; white-space:pre-wrap; }
  #log.show { display:block; }
  /* phones: landscape only (web/MOBILE.md) */
  #rotate { position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); font-size:18px; text-align:center; padding:0 24px; }
  @media (orientation: portrait) { body.mobile #rotate { display:flex; } }
  body.mobile #keys { display:none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
  <div class="card">
    <h1>Jedi Academy</h1>
    <p>Multiplayer · Free For All</p>
    <p id="status">Loading engine…</p>
    <progress id="progress" max="1" value="0"></progress>
    <div><input id="name" maxlength="31" placeholder="Your name" autocomplete="nickname"></div>
    <button id="play" disabled>Join game</button>
    <p id="keys" style="margin-top:18px"><kbd>WASD</kbd> move · <kbd>Mouse</kbd> look · <kbd>Click</kbd> attack ·
      <kbd>Space</kbd> jump · <kbd>Tab</kbd> scores · <kbd>T</kbd> chat · <kbd>~</kbd> console · <kbd>F9</kbd> log</p>
  </div>
</div>
<pre id="log"></pre>
<div id="rotate">Turn your phone sideways to play.</div>
<script>
(function () {
  const statusEl = document.getElementById('status');
  const progressEl = document.getElementById('progress');
  const playBtn = document.getElementById('play');
  const nameEl = document.getElementById('name');
  const logEl = document.getElementById('log');
  const params = new URLSearchParams(location.search);
  const CACHE = 'jka-paks-v1';
  const lines = [];
  // Phones get their own slim pk3, resolution and frame cap (web/MOBILE.md). ?mobile / ?desktop override.
  const MOBILE = params.has('mobile') ? true : params.has('desktop') ? false
    : matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0;
  if (MOBILE) document.body.classList.add('mobile');

  try { nameEl.value = localStorage.getItem('jka-name') || ''; } catch (e) {}
  if (params.has('log')) logEl.classList.add('show');
  window.alert = msg => { console.error('ALERT: ' + msg); log('ALERT: ' + msg); logEl.classList.add('show'); };
  // Keep the engine's main loop running when requestAnimationFrame stops: in hidden tabs, and also in
  // windows that are merely covered by another app (on Linux/Wayland the compositor stops sending frame
  // callbacks while document.visibilityState stays "visible"). The WebSocket keeps queuing server
  // snapshots meanwhile; on return the engine would swallow thousands at once ("CG_ReadNextSnapshot:
  // way out of range") and the server, getting no usercmds, drops us after sv_timeout. So a Worker timer
  // (not throttled like main-thread timers) runs frames whenever rAF has been silent for STALL_MS.
  // ?timer always uses the timer (headless Chrome may not fire rAF).
  {
    const realRAF = window.requestAnimationFrame.bind(window);
    const forceTimer = params.has('timer');
    const TICK_MS = forceTimer ? 4 : 50;  // 20 fps fallback: drains packets and sends usercmds, little CPU
    const STALL_MS = 250;
    let pending = null, rafQueued = false, lastRAF = performance.now();
    const run = () => {
      const f = pending; pending = null;
      if (!f) return;
      const now = performance.now();
      if (window.WebInput) WebInput.frame(now);   // gamepad polling (touch.js)
      f(now);
    };
    const ticker = new Worker(URL.createObjectURL(new Blob(
      ['onmessage=e=>setInterval(()=>postMessage(0),e.data)'], { type: 'text/javascript' })));
    ticker.onmessage = () => {
      if (pending && (forceTimer || document.hidden || performance.now() - lastRAF > STALL_MS)) run();
    };
    ticker.postMessage(TICK_MS);
    // Frame cap on phones (heat, battery): skip display frames instead of the engine's com_maxfps,
    // which busy-waits inside the frame in the browser. ?fps=N overrides the saved setting (phone menu,
    // localStorage 'jka-fps'); 0 = every display frame.
    let saved = 0;
    try { saved = +localStorage.getItem('jka-fps') || 0; } catch (e) {}
    let minGap = 0, lastRun = -1e9;
    window.setMaxFps = fps => { minGap = fps > 0 ? 1000 / fps - 4 : 0; };  // slack for vsync jitter (60/90/120 Hz)
    setMaxFps(params.has('fps') ? +params.get('fps') : MOBILE ? (saved || 30) : 0);
    const onRAF = ts => {
      rafQueued = false; lastRAF = performance.now();
      if (ts - lastRun < minGap) {   // too early for the cap: wait for the next display frame
        if (pending) { rafQueued = true; realRAF(onRAF); }
        return;
      }
      lastRun = ts; run();
    };
    window.requestAnimationFrame = cb => {
      pending = cb;
      // at most one real rAF outstanding, so a stalled window does not replay a burst of frames on return
      if (!forceTimer && !rafQueued) { rafQueued = true; realRAF(onRAF); }
      return 0;
    };
  }

  function log(text) {
    lines.push(text);
    if (lines.length > 800) lines.shift();
    logEl.textContent = lines.join('\n');
    logEl.scrollTop = logEl.scrollHeight;
  }
  window.addEventListener('keydown', e => { if (e.key === 'F9') { logEl.classList.toggle('show'); e.preventDefault(); } });

  const mb = n => (n / 1048576).toFixed(0) + ' MB';

  // Download a pk3 once and keep it in the browser's Cache Storage; later visits load from disk.
  async function loadPak(pak, onBytes) {
    const url = new URL('base/' + pak.name + '?v=' + pak.version, location.href).href;
    let cache = null;
    try { cache = await caches.open(CACHE); } catch (e) { /* no Cache Storage (private mode) */ }
    if (cache) {
      const hit = await cache.match(url);
      if (hit) { const buf = await hit.arrayBuffer(); onBytes(buf.byteLength); return new Uint8Array(buf); }
    }
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(pak.name + ': HTTP ' + resp.status);
    const out = new Uint8Array(pak.size);
    const reader = resp.body.getReader();
    let off = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      out.set(value, off); off += value.length; onBytes(value.length);
    }
    if (cache) {
      try {
        await cache.put(url, new Response(out, { headers: { 'Content-Type': 'application/octet-stream' } }));
        // drop older versions of the same file
        for (const req of await cache.keys())
          if (req.url.includes('/base/' + pak.name + '?') && req.url !== url) await cache.delete(req);
      } catch (e) { log('cache: ' + e.message); }
    }
    return out;
  }

  let engineReady = false, paks = null, manifest = null;
  function maybeReady() {
    if (!engineReady || !paks) return;
    statusEl.textContent = 'Ready.'; progressEl.value = 1; playBtn.disabled = false;
    if (params.has('autostart')) start();
  }

  window.Module = {
    canvas: document.getElementById('canvas'),
    print: t => { console.log(t); log(t); },
    printErr: t => { console.warn(t); log(t); },
    onRuntimeInitialized() { engineReady = true; maybeReady(); },
    onAbort(what) { statusEl.textContent = 'Engine crashed: ' + what; document.getElementById('overlay').classList.remove('hidden'); logEl.classList.add('show'); },
    setStatus(t) { if (t) log(t); },
    // every UDP packet goes over this WebSocket; the gateway relays it to the game server
    websocket: { url: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws', subprotocol: 'binary' },
  };

  (async () => {
    const r = await fetch('base/manifest.json');
    if (r.status === 401) { location.href = '/login'; return; }
    manifest = await r.json();
    log('mode: ' + (MOBILE ? 'mobile' : 'desktop'));
    if (MOBILE) {
      manifest.paks = manifest.mobile || [];
      if (!manifest.paks.length)
        throw new Error('the server is still preparing the phone version of the game data, try again in a few minutes');
    }
    if (!manifest.paks.length) throw new Error('the server has no game data (pk3) installed');
    const total = manifest.paks.reduce((a, p) => a + p.size, 0);
    let got = 0;
    const tick = n => { got += n; progressEl.value = 0.95 * got / total; statusEl.textContent = 'Loading game data… ' + mb(got) + ' / ' + mb(total); };
    const data = [];
    for (const p of manifest.paks) data.push(await loadPak(p, tick));
    paks = data;
    statusEl.textContent = 'Game data loaded.';
    maybeReady();
  })().catch(e => { statusEl.textContent = 'Failed to load game data: ' + e.message; });

  function start() {
    if (!engineReady || !paks || start.done) return;
    start.done = true;
    if (MOBILE) WebInput.fullscreen();   // needs the tap's user activation, so before anything async
    const name = (nameEl.value || 'Padawan').replace(/[";\\]/g, '').slice(0, 31);
    try { localStorage.setItem('jka-name', name); } catch (e) {}
    const FS = Module.FS;
    FS.mkdirTree('/jka/base');
    FS.mkdirTree('/home/web');
    // canOwn: MEMFS keeps the downloaded buffer instead of copying it (the pk3 would be in memory twice)
    manifest.paks.forEach((p, i) => { FS.writeFile('/jka/base/' + p.name, paks[i], { canOwn: true }); paks[i] = null; });
    paks = [];
    document.getElementById('overlay').classList.add('hidden');
    let video = ['+set', 'r_mode', '-2', '+set', 'com_hunkmegs', '256'];
    if (MOBILE) {
      // render at the screen's CSS pixel size in landscape (devicePixelRatio ignored; the game runs in
      // fullscreen or as an installed app), at most 1280 wide; 30 fps.
      let w = Math.max(screen.width, screen.height), h = Math.min(screen.width, screen.height);
      if (w > 1280) { h = h * 1280 / w; w = 1280; }
      w = Math.floor(w / 2) * 2; h = Math.floor(h / 2) * 2;
      video = ['+set', 'r_mode', '-1', '+set', 'r_customwidth', String(w), '+set', 'r_customheight', String(h),
               '+set', 'com_hunkmegs', '128', '+set', 'com_maxfps', '0'];  // the shell caps the rate
      log('mobile video: ' + w + 'x' + h);
    }
    const args = ['+set', 'fs_basepath', '/jka', '+set', 'fs_homepath', '/home/web',
                  ...video, '+set', 'r_fullscreen', '0',
                  '+set', 'net_enabled', '1', '+set', 'cl_allowDownload', '0',
                  '+set', 'sv_master1', '', '+set', 'sv_master2', '', '+set', 'sv_master3', '',
                  '+set', 'name', name,
                  '+connect', 'jka-server:29070'];
    Module.callMain(args);
    Module.canvas.focus();
    WebInput.init(Module, MOBILE);   // touch overlay on phones, gamepad everywhere (touch.js)
  }
  playBtn.addEventListener('click', start);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => log('sw: ' + e.message));
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
})();
</script>
<script src="touch.js"></script>
<script async src="openjk_mp.js"></script>
</body>
</html>
